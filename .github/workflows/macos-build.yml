name: Mac Port Structure and Compilation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate-mac-port.py
      - run: bash -n script/build_and_run.sh script/test_mac.sh
  compile:
    needs: structure
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: python3 script/prepare_mac_resources.py
      - name: Compile app, embedded widget and test bundles without signing
        run: >-
          xcodebuild -project OnsenMac.xcodeproj -scheme OnsenMac
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath build/mac CODE_SIGNING_ALLOWED=NO build-for-testing
      # Signed install, UI tests and desktop-widget acceptance run on a configured Mac.
