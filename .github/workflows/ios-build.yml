name: iOS Build and Test
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    name: Design, documentation and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n build.sh
      - run: ./scripts/lint-design-system.sh
      - run: ./scripts/validate-docs.sh --quiet
      - run: python3 scripts/validate-release-config.py
  build-and-test:
    name: Build and Test iOS App
    runs-on: macos-15
    timeout-minutes: 45
    needs: static-checks
    env:
      VECKA_TEST_RESULTS: ${{ github.workspace }}/build/VeckaTests.xcresult
    steps:
      - uses: actions/checkout@v4
      - name: Select supported Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: ./build.sh validate
      - name: Build app and embedded widget
        run: ./build.sh build
      - name: Run unit and recovery regression tests
        run: ./build.sh test
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vecka-test-results
          path: build/*.xcresult
          if-no-files-found: ignore
